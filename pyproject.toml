[project]
name = "healthcare-rag"
version = "0.1.0"
description = "Local healthcare RAG over a medical manual: Ollama (nomic embeddings + chat) + Chroma"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.4",
    "chromadb>=0.5",
    "pypdf>=6.21.4",
    "ipykernel>=6.29",
    "jupyterlab>=4.6.5",
]

# Floors are the patched releases for open Dependabot alerts.
# Caps keep the resolver off a newer major, or off a minor this app does not need:
# anyio 4.15 lazy-imports submodules, tornado 6.6 is outside the patched 6.5 line,
# mistune 3.4 reworks inline parsing, soupsieve 2.10 tightens the selector API,
# multidict 7 is a major with no advisory requiring it.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.5",
    "anyio>=4.14.2,<4.15",
    "certifi>=2026.10.23",
    "mistune>=3.3.4,<3.4",
    "multidict>=6.9.1,<7",
    "nbconvert>=7.17.2",
    "opentelemetry-api>=1.45.2",
    "soupsieve>=2.9.2,<2.10",
    "tornado>=6.5.10,<6.6",
    "urllib3>=2.8.0",
]
